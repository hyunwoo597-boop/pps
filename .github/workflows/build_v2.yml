name: Build Tico Dolphin WW Performance

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Clone Tico Dolphin
        run: |
          set -eux
          git clone --recursive https://github.com/ticohq/tico-dolphin.git /work/core
          cd /work/core
          git submodule update --init --recursive

      - name: Add Wind Waker performance profile
        env:
          WW_PROFILE_B64: ""
        run: |
          set -eux
          TARGET=/work/core/Data/Sys/GameSettings/GZL.ini
          mkdir -p "$(dirname "$TARGET")"
          printf '%s' "$WW_PROFILE_B64" | base64 -d > /tmp/ww.ini
          printf '\n\n' >> "$TARGET"
          cat /tmp/ww.ini >> "$TARGET"
          tail -n 70 "$TARGET"

      - name: Build NRO
        env:
          TICO_NRO_VERSION: "0.0.8-wwperf"
          CFLAGS: "-O3 -DNDEBUG -mcpu=cortex-a57 -mtune=cortex-a57"
          CXXFLAGS: "-O3 -DNDEBUG -mcpu=cortex-a57 -mtune=cortex-a57"
        run: |
          set -eux
          cd /work/core
          chmod +x build_dolphin_standalone_nro.sh
          ./build_dolphin_standalone_nro.sh

      - name: Copy result
        run: |
          set -eux
          cp /work/core/build_nx_standalone/dolphin.nro "$GITHUB_WORKSPACE/tico-dolphin-ww-performance.nro"
          sha256sum "$GITHUB_WORKSPACE/tico-dolphin-ww-performance.nro"

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: tico-dolphin-ww-performance
          path: tico-dolphin-ww-performance.nro
          if-no-files-found: error
