name: Build Tico Dolphin WW Performance v6

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Clone official Tico Dolphin 0.0.8
        run: |
          set -euxo pipefail
          git clone --recursive --branch 0.0.8 https://github.com/ticohq/tico-dolphin.git /work/core
          cd /work/core
          git submodule update --init --recursive

      - name: Fix GameCube Sys path compile mismatch
        run: |
          set -euxo pipefail

          HEADER=/work/core/Source/Core/Common/CommonPaths.h
          BOOT=/work/core/Source/Core/Core/BootManager.cpp

          test -f "$HEADER"
          test -f "$BOOT"

          if ! grep -q '^#define GC_SYS_DIR ' "$HEADER"; then
            printf '\n// Tico build compatibility fix\n#define GC_SYS_DIR "GC"\n' >> "$HEADER"
          fi

          if ! grep -q '"Common/CommonPaths.h"' "$BOOT"; then
            sed -i '/#include "Common\/FileUtil.h"/i #include "Common/CommonPaths.h"' "$BOOT"
          fi

          echo "---- CommonPaths.h ----"
          grep -n 'GC_SYS_DIR' "$HEADER"

          echo "---- BootManager includes ----"
          grep -n 'CommonPaths.h\|FileUtil.h' "$BOOT"

          echo "---- BootManager GC_SYS_DIR use ----"
          grep -n 'GC_SYS_DIR' "$BOOT"

      - name: Add Wind Waker profile
        env:
          WW_PROFILE_B64: ""
        run: |
          set -euxo pipefail
          TARGET=/work/core/Data/Sys/GameSettings/GZL.ini
          mkdir -p "$(dirname "$TARGET")"
          [ -f "$TARGET" ] || touch "$TARGET"
          printf '\n\n' >> "$TARGET"
          printf '%s' "$WW_PROFILE_B64" | base64 -d >> "$TARGET"
          tail -n 70 "$TARGET"

      - name: Make build deterministic
        run: |
          set -euxo pipefail
          cd /work/core
          sed -i 's/-j"$(nproc)"/-j1/' build_dolphin_standalone_nro.sh
          grep 'cmake --build' build_dolphin_standalone_nro.sh || true

      - name: Build NRO
        run: |
          set -euxo pipefail
          cd /work/core
          chmod +x build_dolphin_standalone_nro.sh
          bash ./build_dolphin_standalone_nro.sh 2>&1 | tee /tmp/build.log

      - name: Copy result
        run: |
          set -euxo pipefail
          test -f /work/core/build_nx_standalone/dolphin.nro
          cp /work/core/build_nx_standalone/dolphin.nro "$GITHUB_WORKSPACE/tico-dolphin-ww-performance.nro"
          sha256sum "$GITHUB_WORKSPACE/tico-dolphin-ww-performance.nro"

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: tico-dolphin-ww-performance
          path: tico-dolphin-ww-performance.nro
          if-no-files-found: error
